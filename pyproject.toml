[project]
name = "wg-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "python-jose[cryptography]>=3.3.0",
  "argon2-cffi>=23.1.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "pydantic>=2.0.0",
]

[tool.uvicorn]
factory = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
